plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    // TEMPORARY V2-TE P0-3 PROBE SUPPORT - remove with the probe. Modrinth maven, used only to
    // resolve the pinned Trade Everything artifact for a dev/test reachability probe.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Config screen only. Both are optional at runtime; nothing on the common path touches them.
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // Social Player Mobs is deliberately NOT a dependency — see PlayerMobs.java.

    // TEMPORARY V2-TE P0-3 PROBE SUPPORT - dev/test only, never shipped. `modCompileOnly` keeps it
    // off the production runtime classpath and out of the jar; the probe needs the REAL classes
    // because reimplementing Trade Everything's pricing would make the oracle share the assumptions
    // of the thing it is measuring.
    modCompileOnly "maven.modrinth:${te_slug}:${te_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs.add('-Xlint:deprecation')
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
