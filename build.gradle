import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

sourceSets {
    validation {
        java.srcDir 'src/validation/java'
        resources.srcDirs = ['src/validation/resources', 'test-datapacks/phase-village-raid',
                             'test-datapacks/v4-settlement-integration']
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }

    validationTest {
        java.srcDir 'src/validationTest/java'
        resources.srcDir 'src/validationTest/resources'
        compileClasspath += sourceSets.validation.output
        compileClasspath += sourceSets.validation.compileClasspath
        compileClasspath += sourceSets.test.compileClasspath
        runtimeClasspath += output
        runtimeClasspath += sourceSets.validation.output
        runtimeClasspath += sourceSets.validation.runtimeClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
}

tasks.named('processValidationResources') {
    // The validation sidecar merges two independently runnable certification datapacks. Their
    // root pack.mcmeta/README files are equivalent packaging metadata; data namespaces are unique.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    validationTestImplementation.extendsFrom testImplementation
    validationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

loom {
    createRemapConfigurations(sourceSets.validation)

    mods {
        spmscavenger {
            sourceSet sourceSets.main
        }
        spmscavenger_validation {
            sourceSet sourceSets.validation
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Config screen only. Both are optional at runtime; nothing on the common path touches them.
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // Social Player Mobs is deliberately NOT a dependency — see PlayerMobs.java.

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    validationImplementation sourceSets.main.output
    validationTestImplementation sourceSets.main.output
    validationTestImplementation sourceSets.validation.output
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named('processValidationResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs.add('-Xlint:deprecation')
}

test {
    useJUnitPlatform()
}

def spmReferenceFile = file(project.property('spm_reference_jar'))

tasks.withType(Test).configureEach {
    systemProperty 'spm.reference.jar', spmReferenceFile.absolutePath
    systemProperty 'spm.reference.version', project.property('spm_reference_version')
    systemProperty 'spm.reference.sha256', project.property('spm_reference_sha256')
}

def verifySpmHostBaseline = tasks.register('verifySpmHostBaseline') {
    description = 'Pins and verifies the optional Social Player Mobs compatibility oracle.'
    group = 'verification'
    inputs.file(spmReferenceFile)
    doLast {
        if (!spmReferenceFile.isFile()) {
            throw new GradleException("Missing pinned SPM reference artifact: ${spmReferenceFile}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        spmReferenceFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
                if (read > 0) {
                    digest.update(buffer, 0, read)
                }
            }
        }
        def actual = digest.digest().encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
        def expected = project.property('spm_reference_sha256').toString().toUpperCase(java.util.Locale.ROOT)
        if (actual != expected) {
            throw new GradleException("SPM reference SHA-256 ${actual} != pinned ${expected}")
        }
    }
}

def validationTestTask = tasks.register('validationTest', Test) {
    description = 'Runs validation/test-mod structural tests.'
    group = 'verification'
    testClassesDirs = sourceSets.validationTest.output.classesDirs
    classpath = sourceSets.validationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

def validationDevJar = tasks.register('validationDevJar', Jar) {
    dependsOn tasks.named('validationClasses')
    from sourceSets.validation.output
    archiveClassifier.set('validation-dev')
    destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
}

def remapValidationJar = tasks.register('remapValidationJar', RemapJarTask) {
    dependsOn validationDevJar
    inputFile.set(validationDevJar.flatMap { it.archiveFile })
    archiveClassifier.set('validation')
    addNestedDependencies.set(false)
}

def auditProductionJar = tasks.register('auditProductionJar') {
    dependsOn tasks.named('remapJar')
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        def jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name } as Set
            def forbidden = names.findAll {
                it.startsWith('com/noobk/spmscavenger/validation/')
                        || it.startsWith('com/noobk/spmscavenger/debug/V3')
                        || it.startsWith('data/spm_vr/')
                        || it.endsWith('/SettlementTier.class')
                        || it.contains('V3RuntimeCampaignController')
                        || it.contains('V3RuntimeWitnessCommands')
                        || it.contains('V3CampaignScenario')
                        || it.contains('V3Gate0')
                        || it.contains('V3Contamination')
                        || it.contains('V3CampaignProgress')
                        || it.contains('V3ScenarioEvidence')
                        || it.contains('V3HarvestEpisodeProbe')
                        || it == 'spmscavenger.validation.mixins.json'
            }
            if (!forbidden.empty) {
                throw new GradleException("Production JAR contains validation entries: ${forbidden}")
            }
            def metadata = new groovy.json.JsonSlurper()
                    .parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (metadata.id != 'spmscavenger') {
                throw new GradleException("Production metadata ID is ${metadata.id}")
            }
        }
    }
}

def auditValidationJar = tasks.register('auditValidationJar') {
    dependsOn tasks.named('remapJar')
    dependsOn remapValidationJar
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    inputs.file(remapValidationJar.flatMap { it.archiveFile })
    doLast {
        def productionFile = tasks.named('remapJar').get().archiveFile.get().asFile
        def validationFile = remapValidationJar.get().archiveFile.get().asFile
        Set<String> productionClasses
        new java.util.zip.ZipFile(productionFile).withCloseable { zip ->
            productionClasses = zip.entries()
                    .findAll { !it.directory && it.name.endsWith('.class') }
                    .collect { it.name } as Set
        }
        new java.util.zip.ZipFile(validationFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name } as Set
            def validationClasses = names.findAll { it.endsWith('.class') } as Set
            def duplicates = validationClasses.intersect(productionClasses)
            if (!duplicates.empty) {
                throw new GradleException("Validation JAR duplicates production classes: ${duplicates}")
            }
            def outsideNamespace = validationClasses.findAll {
                !it.startsWith('com/noobk/spmscavenger/validation/')
            }
            if (!outsideNamespace.empty) {
                throw new GradleException(
                        "Validation classes outside validation namespace: ${outsideNamespace}")
            }
            def metadata = new groovy.json.JsonSlurper()
                    .parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (metadata.id != 'spmscavenger_validation') {
                throw new GradleException("Validation metadata ID is ${metadata.id}")
            }
            if (!metadata.depends?.containsKey('spmscavenger')) {
                throw new GradleException('Validation metadata lacks spmscavenger dependency')
            }
            def lethalCleanupResources = names.findAll {
                it.startsWith('data/spm_v4/') && !it.endsWith('/')
            }.findAll { entryName ->
                zip.getInputStream(zip.getEntry(entryName)).getText('UTF-8')
                        .contains('kill @e[tag=spm_v4.fixture]')
            }
            if (!lethalCleanupResources.empty) {
                throw new GradleException(
                        "Validation JAR contains lethal V4 fixture cleanup: ${lethalCleanupResources}")
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn remapValidationJar
}

tasks.named('check') {
    dependsOn verifySpmHostBaseline
    dependsOn validationTestTask
    dependsOn auditProductionJar
    dependsOn auditValidationJar
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
